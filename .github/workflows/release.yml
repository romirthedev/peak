name: Build & Release

# ─────────────────────────────────────────────────────────────────────────────
# Triggers:
#   • Push a tag like "v1.2.3" → builds, creates a GitHub Release, uploads DMG
#   • Manual dispatch → builds a DMG artifact (no public release created)
# ─────────────────────────────────────────────────────────────────────────────
permissions:
  contents: write

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.0.0)"
        required: false
        default: "1.0.0"

jobs:
  build:
    name: Build macOS App
    runs-on: macos-15          # Apple Silicon runner — Xcode 16 / Swift 6

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Version ───────────────────────────────────────────────────────────
      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version || '1.0.0' }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      # ── 3. Cache SPM dependencies ─────────────────────────────────────────────
      - name: Cache Swift PM
        uses: actions/cache@v4
        with:
          path: |
            .build/checkouts
            .build/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # ── 4. Build universal .app ───────────────────────────────────────────────
      - name: Build Peak.app
        run: bash scripts/build.sh
        env:
          VERSION: ${{ env.VERSION }}
          # For signed builds, add these secrets in your repo settings:
          #   SIGN_IDENTITY: "Developer ID Application: Your Name (TEAMID)"
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY || '-' }}

      # ── 5. (Optional) Notarize ───────────────────────────────────────────────
      # Uncomment when you have an Apple Developer account and have added
      # APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD secrets to the repo.
      #
      # - name: Notarize
      #   if: startsWith(github.ref, 'refs/tags/')
      #   run: |
      #     xcrun notarytool submit .build/staging/Peak.app \
      #       --apple-id "${{ secrets.APPLE_ID }}" \
      #       --team-id  "${{ secrets.APPLE_TEAM_ID }}" \
      #       --password "${{ secrets.APPLE_APP_PASSWORD }}" \
      #       --wait
      #     xcrun stapler staple .build/staging/Peak.app

      # ── 6. Package into DMG ───────────────────────────────────────────────────
      - name: Create DMG
        run: bash scripts/create-dmg.sh
        env:
          VERSION: ${{ env.VERSION }}

      # ── 7. Upload artifact (always — useful for manual builds too) ────────────
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Peak-${{ env.VERSION }}
          path: .build/Peak.dmg
          retention-days: 30

      # ── 8. Publish GitHub Release (only on tag push) ──────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Peak ${{ env.VERSION }}"
          body: |
            ## Peak ${{ env.VERSION }}

            ### Installation
            1. Download **Peak.dmg** below
            2. Open the DMG
            3. Drag **Peak.app** to your Applications folder
            4. Launch Peak from Applications (or Spotlight)
            5. Click **Allow** for Screen Recording and Microphone when prompted

            ### Requirements
            - macOS 13 Ventura or later
            - [Ollama](https://ollama.ai) running locally
            - Models: `ollama pull llama3.2 && ollama pull nomic-embed-text`

            > **First launch note:** Because this build is not yet notarized,
            > macOS Gatekeeper may show a warning. Right-click → Open to bypass it once.
            > Notarization (seamless launch) is coming in a future release.
          files: .build/Peak.dmg
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
