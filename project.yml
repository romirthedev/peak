name: Peak
options:
  bundleIdPrefix: com.peak
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  indentWidth: 4
  tabWidth: 4

packages:
  SQLite.swift:
    url: https://github.com/stephencelis/SQLite.swift
    from: "0.15.3"
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"

targets:
  Peak:
    type: application
    platform: macOS
    sources:
      - path: Peak
        excludes:
          - "App/Info.plist"
          - "App/Peak.entitlements"
    info:
      path: Peak/App/Info.plist
      properties:
        CFBundleName: Peak
        CFBundleDisplayName: Peak
        CFBundleIdentifier: com.peak.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2024 Peak. All rights reserved."
        NSPrincipalClass: NSApplication
        NSScreenCaptureUsageDescription: "Peak needs screen capture access to record your screen and help you remember what you were working on."
        NSMicrophoneUsageDescription: "Peak needs microphone access to transcribe meetings and voice notes."
        NSAppleEventsUsageDescription: "Peak needs Apple Events access to monitor your active browser URL."
    entitlements:
      path: Peak/App/Peak.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.temporary-exception.apple-events: "com.apple.Safari"
    dependencies:
      - package: SQLite.swift
        product: SQLite
      - package: WhisperKit
        product: WhisperKit
    settings:
      base:
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        PRODUCT_NAME: Peak
        PRODUCT_BUNDLE_IDENTIFIER: com.peak.app
        INFOPLIST_FILE: Peak/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Peak/App/Peak.entitlements
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          ENABLE_TESTABILITY: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          SWIFT_OPTIMIZATION_LEVEL: "-O"
